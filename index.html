<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alchemy Block Invaders</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background: #0a1929;
      color: #ecfeff;
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }

    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #0a1929 0%, #1a2845 100%);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: rgba(20, 30, 50, 0.8);
    }

    .hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 25, 41, 0.6);
      border-bottom: 1px solid rgba(94, 234, 212, 0.2);
      font-size: 14px;
      z-index: 10;
    }

    .hud-left, .hud-right {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 600;
      color: #5eead4;
    }

    .tome-button {
      padding: 8px 16px;
      background: rgba(94, 234, 212, 0.15);
      border: 1px solid rgba(94, 234, 212, 0.5);
      border-radius: 4px;
      color: #5eead4;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .tome-button:hover {
      background: rgba(94, 234, 212, 0.25);
      border-color: #5eead4;
    }

    .elemental-affinity {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .element-indicator {
      width: 20px;
      height: 20px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      opacity: 0.6;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .element-indicator.active {
      opacity: 1;
      border-color: currentColor;
    }

    .element-indicator.fire { color: #ff6b6b; background: rgba(255, 107, 107, 0.1); }
    .element-indicator.water { color: #4dabf7; background: rgba(77, 171, 247, 0.1); }
    .element-indicator.air { color: #ffd43b; background: rgba(255, 212, 59, 0.1); }
    .element-indicator.earth { color: #8b6f47; background: rgba(139, 111, 71, 0.1); }

    .tome-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      overflow: auto;
    }

    .tome-modal.active {
      display: block;
    }

    .tome-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20, 35, 55, 0.95);
      border: 1px solid rgba(94, 234, 212, 0.4);
      border-radius: 8px;
      width: 90vw;
      max-width: 700px;
      max-height: 80vh;
      padding: 32px;
      overflow-y: auto;
      box-shadow: 0 0 40px rgba(94, 234, 212, 0.1);
    }

    .tome-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: none;
      color: #5eead4;
      font-size: 28px;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .tome-close:hover {
      color: #fff;
    }

    .tome-title {
      font-size: 24px;
      font-weight: 600;
      margin: 0 0 24px;
      color: #5eead4;
    }

    .tome-section {
      margin-bottom: 24px;
    }

    .tome-section-title {
      font-size: 16px;
      font-weight: 600;
      color: #5eead4;
      margin: 0 0 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(94, 234, 212, 0.2);
      padding-bottom: 8px;
    }

    .tome-entry {
      margin-bottom: 16px;
      padding: 12px;
      background: rgba(10, 25, 41, 0.5);
      border-left: 3px solid #5eead4;
      border-radius: 2px;
    }

    .tome-entry.locked {
      opacity: 0.5;
      border-left-color: rgba(94, 234, 212, 0.2);
    }

    .tome-entry-title {
      font-weight: 600;
      margin: 0 0 6px;
      font-size: 14px;
    }

    .tome-entry-desc {
      font-size: 13px;
      color: #a7c9c2;
      line-height: 1.5;
      margin: 0;
    }

    .game-over {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 25, 41, 0.95);
      border: 2px solid #ff6b6b;
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      z-index: 200;
    }

    .game-over.active {
      display: block;
    }

    .game-over h2 {
      font-size: 32px;
      margin: 0 0 16px;
      color: #ff6b6b;
    }

    .game-over p {
      margin: 0 0 20px;
      font-size: 16px;
      color: #a7c9c2;
    }

    .game-over button {
      padding: 10px 20px;
      background: #ff6b6b;
      border: none;
      border-radius: 4px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }

    .game-over button:hover {
      background: #ff5252;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <div class="hud">
      <div class="hud-left">
        <div class="stat">
          <div class="stat-label">Score</div>
          <div class="stat-value" id="scoreDisplay">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Health</div>
          <div class="stat-value" id="healthDisplay">3</div>
        </div>
        <div class="stat">
          <div class="stat-label">Wave</div>
          <div class="stat-value" id="waveDisplay">1</div>
        </div>
      </div>

      <div class="elemental-affinity">
        <div class="element-indicator fire" title="Fire">🔥</div>
        <div class="element-indicator water" title="Water">💧</div>
        <div class="element-indicator air" title="Air">🌬️</div>
        <div class="element-indicator earth" title="Earth">🌍</div>
      </div>

      <div class="hud-right">
        <button class="tome-button" id="tomeButton">📖 Tome</button>
      </div>
    </div>

    <canvas id="gameCanvas"></canvas>
  </div>

  <div class="tome-modal" id="tomeModal">
    <div class="tome-content">
      <button class="tome-close" id="tomeClose">&times;</button>
      <h2 class="tome-title">Spellbook of Alchemy</h2>
      <div id="tomeEntries"></div>
    </div>
  </div>

  <div class="game-over" id="gameOver">
    <h2>Game Over</h2>
    <p>Final Score: <span id="finalScore">0</span></p>
    <button onclick="location.reload()">Play Again</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
